<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor - CriarSite Pro</title>
  <link rel="stylesheet" href="../assets/css/editor.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="toolbar">
    <button onclick="history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Voltar</button>
    <div class="logo">CriarSite<span>Pro</span></div>
    <div class="toolbar-actions">
      <button onclick="generateWithAI()" class="ai-btn"><i class="fas fa-magic"></i> Gerar com IA</button>
      <button onclick="saveSite()">Salvar</button>
      <button onclick="publishSite()" class="publish-btn">Publicar</button>
    </div>
  </div>

  <div class="main-container">
    <!-- Sidebar Blocos -->
    <div class="sidebar">
      <h3>Blocos Essenciais</h3>
      <div class="block" draggable="true" data-type="header">Cabeçalho</div>
      <div class="block" draggable="true" data-type="hero">Hero</div>
      <div class="block" draggable="true" data-type="features">Funcionalidades</div>
      <div class="block" draggable="true" data-type="gallery">Galeria</div>
      <div class="block" draggable="true" data-type="testimonials">Depoimentos</div>
      <div class="block" draggable="true" data-type="contact">Contato</div>
      <div class="block" draggable="true" data-type="pricing">Preços</div>
      <div class="block" draggable="true" data-type="footer">Rodapé</div>
    </div>

    <!-- Canvas -->
    <div id="canvas" class="canvas"></div>

    <!-- Propriedades (Agora Funcional) -->
    <div class="properties-panel">
      <h3>Propriedades</h3>
      <div id="properties-content">Selecione um bloco no canvas</div>
    </div>
  </div>

  <script src="../assets/js/drag-drop.js"></script>
  <script src="../assets/js/ai-generator.js"></script>
</body>
</html>
