<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Profissional - CriarSite Pro</title>
  <link rel="stylesheet" href="assets/css/editor.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button onclick="window.location.href='dashboard.html'" class="back-btn">
        <i class="fas fa-arrow-left"></i> Voltar ao Dashboard
      </button>
      <div class="logo">CriarSite<span>Pro</span></div>
    </div>

    <div class="toolbar-center">
      <button onclick="undo()" title="Desfazer"><i class="fas fa-undo"></i></button>
      <button onclick="redo()" title="Refazer"><i class="fas fa-redo"></i></button>
      <button onclick="generateWithAI()" class="ai-btn">
        <i class="fas fa-magic"></i> Gerar com IA
      </button>
    </div>

    <div class="toolbar-right">
      <button onclick="saveSite()" class="save-btn">💾 Salvar</button>
      <button onclick="publishSite()" class="publish-btn">🚀 Publicar</button>
    </div>
  </div>

  <div class="main-container">
    <!-- Sidebar Blocos -->
    <div class="sidebar">
      <h3><i class="fas fa-cubes"></i> Blocos</h3>
      <div class="block" draggable="true" data-type="hero">Hero Section</div>
      <div class="block" draggable="true" data-type="header">Cabeçalho</div>
      <div class="block" draggable="true" data-type="features">Funcionalidades</div>
      <div class="block" draggable="true" data-type="gallery">Galeria</div>
      <div class="block" draggable="true" data-type="testimonials">Depoimentos</div>
      <div class="block" draggable="true" data-type="pricing">Planos</div>
      <div class="block" draggable="true" data-type="faq">FAQ</div>
      <div class="block" draggable="true" data-type="contact">Contato</div>
      <div class="block" draggable="true" data-type="footer">Rodapé</div>
    </div>

    <!-- Canvas -->
    <div id="canvas" class="canvas"></div>

    <!-- Painel de Propriedades (AGORA FUNCIONANDO) -->
    <div class="properties-panel">
      <h3><i class="fas fa-sliders-h"></i> Propriedades</h3>
      <div id="properties-content">
        <p class="empty-prop">Selecione um elemento no canvas para editar</p>
      </div>
    </div>
  </div>

  <script src="assets/js/drag-drop.js"></script>
  <script src="assets/js/ai-generator.js"></script>
  <script src="assets/js/properties.js"></script>
</body>
</html>
